- id: section-030
  title: Secure your supply chain (permitted registries, sign and validate artifacts, etc.)
  curriculum_item: Secure your supply chain (permitted registries, sign and validate artifacts, etc.)
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Admission Policy And Extension Trust
    objectives:
    - Distinguish mutation, validation and authorization.
