- id: section-020
  title: Understand your supply chain (e.g. SBOM, CI/CD, artifact repositories)
  curriculum_item: Understand your supply chain (e.g. SBOM, CI/CD, artifact repositories)
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Supply Chain Trust And Verification
    objectives:
