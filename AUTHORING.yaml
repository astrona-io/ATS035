version: 1
approval: Maintainer requested CKA and CKS playgrounds and graded labs on 2026-10-13,
  superseding the earlier reading-only scope.
course:
  id: ATS035
  certification:
    name: Certified Kubernetes Security Specialist
    code: CKS
    provider: CNCF / Linux Foundation
    domain: Supply Chain Security
    weight: 20
    competencies:
    - Minimize base image footprint
    - Understand your supply chain (e.g. SBOM, CI/CD, artifact repositories)
    - Secure your supply chain (permitted registries, sign and validate artifacts,
      etc.)
    - Perform static analysis of user workloads and container images (e.g. Kubesec,
      KubeLinter)
defaults:
  playground: true
  module_lab: false
  capstone: false
  section_quiz: false
  final_quiz: true
assessment_format: YAML question banks v1, registered in assessments/index.yaml
sections:
- id: section-010
  title: Minimize base image footprint
  curriculum_item: Minimize base image footprint
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Image Identity And Distribution
    objectives:
    - Explain image layers and immutable digests.
    - Distinguish tags from exact image identity.
    - Trace image retrieval and registry authentication.
    - Diagnose image selection and pull failures.
    outline:
    - Layers, Tags And Digests
    - From Build To Image Pull
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-010/module-01/course-01-layers-tags-and-digests.md
      adapted_from: ATS027/sections/section-010/module-01/course-01-layers-tags-and-digests.md
    - reading: sections/section-010/module-01/course-02-from-build-to-image-pull.md
      adapted_from: ATS027/sections/section-010/module-01/course-02-from-build-to-image-pull.md
    - reading: sections/section-010/module-01/course-03-guided-practice.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-010/module-01/labs/lab-01
      after_reading: sections/section-010/module-01/course-02-from-build-to-image-pull.md
      objective: Select an image providing only the required HTTP process and verify
        its running contents.
      status: draft
      runtime_verification: pending
    practice_readings:
    - sections/section-010/module-01/course-03-guided-practice.md
- id: section-020
  title: Understand your supply chain (e.g. SBOM, CI/CD, artifact repositories)
  curriculum_item: Understand your supply chain (e.g. SBOM, CI/CD, artifact repositories)
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Supply Chain Trust And Verification
    objectives:
    - Trace source, build, publication and deployment trust boundaries.
    - Distinguish provenance, signatures, inventories and vulnerability findings.
    - Relate admission decisions to exact artifact identity.
    - Explain continued maintenance after an artifact is approved.
    outline:
    - Artifact Evidence And Sensitive Build Inputs
    - Connecting Verification To Execution Policy
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-020/module-01/course-01-artifact-evidence-and-sensitive-build-inputs.md
      adapted_from: ATS045/sections/section-010/module-01/course-01-artifact-evidence-and-sensitive-build-inputs.md
    - reading: sections/section-020/module-01/course-02-connecting-verification-to-execution-policy.md
      adapted_from: ATS045/sections/section-010/module-01/course-02-connecting-verification-to-execution-policy.md
    - reading: sections/section-020/module-01/course-03-guided-practice.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-020/module-01/labs/lab-01
      after_reading: sections/section-020/module-01/course-02-connecting-verification-to-execution-policy.md
      objective: Record installed operating-system packages and the image identity
        actually running them.
      status: draft
      runtime_verification: pending
    practice_readings:
    - sections/section-020/module-01/course-03-guided-practice.md
- id: section-030
  title: Secure your supply chain (permitted registries, sign and validate artifacts,
    etc.)
  curriculum_item: Secure your supply chain (permitted registries, sign and validate
    artifacts, etc.)
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Admission Policy And Extension Trust
    objectives:
    - Distinguish mutation, validation and authorization.
    - Explain built-in, declarative and webhook admission mechanisms.
    - Relate failure policy and exemptions to effective enforcement.
    - Identify extension credentials, transport and availability requirements.
    outline:
    - Admission As A Controlled Resource Decision
    - Connecting Verification To Execution Policy
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-030/module-01/course-01-admission-as-a-controlled-resource-decision.md
      adapted_from: ATS045/sections/section-070/module-01/course-01-admission-as-a-controlled-resource-decision.md
    - reading: sections/section-030/module-01/course-02-connecting-verification-to-execution-policy.md
      adapted_from: ATS045/sections/section-010/module-01/course-02-connecting-verification-to-execution-policy.md
    - reading: sections/section-030/module-01/course-03-guided-practice.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-030/module-01/labs/lab-01
      after_reading: sections/section-030/module-01/course-02-connecting-verification-to-execution-policy.md
      objective: Use a validating admission policy and binding to deny an unapproved
        image before scheduling.
      status: draft
      runtime_verification: pending
    practice_readings:
    - sections/section-030/module-01/course-03-guided-practice.md
- id: section-040
  title: Perform static analysis of user workloads and container images (e.g. Kubesec,
    KubeLinter)
  curriculum_item: Perform static analysis of user workloads and container images
    (e.g. Kubesec, KubeLinter)
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Static Workload And Image Analysis In A Release Decision
    objectives:
    - Distinguish manifest linting from vulnerability and runtime assessment.
    - Explain how Kubesec and KubeLinter identify risky declarations.
    - Bind image findings to artifact identity and scanner evidence.
    - Evaluate exceptions and admission enforcement without equating scores with safety.
    outline:
    - Static Workload And Image Analysis In A Release Decision
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-01/course-01-static-workload-and-image-analysis-in-a-release-decision.md
      adapted_from: null
    - reading: sections/section-040/module-01/course-02-guided-practice.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-040/module-01/labs/lab-01
      after_reading: sections/section-040/module-01/course-01-static-workload-and-image-analysis-in-a-release-decision.md
      objective: Inspect a non-executed unsafe resource definition and run a corrected
        restricted workload.
      status: draft
      runtime_verification: pending
    practice_readings:
    - sections/section-040/module-01/course-02-guided-practice.md
