training:
  id: ATS035
  title: 'CKS: Supply Chain Security'
  description: 'Detailed reading material and reusable YAML knowledge checks for CKS: Supply Chain Security. Each module has a playground, at least two graded labs and a knowledge check.'
  certification:
    name: Certified Kubernetes Security Specialist
    code: CKS
    provider: CNCF / Linux Foundation
    domain: Supply Chain Security
    weight: 20
    competencies:
    - Minimize base image footprint
    - Understand your supply chain (e.g. SBOM, CI/CD, artifact repositories)
    - Secure your supply chain (permitted registries, sign and validate artifacts, etc.)
    - Perform static analysis of user workloads and container images (e.g. Kubesec, KubeLinter)
