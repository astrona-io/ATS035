training:
  id: ATS035
  title: 'CKS: Supply Chain Security'
  description: 'Detailed reading material and reusable YAML knowledge checks for CKS:
    Supply Chain Security. Technical content remains draft. Each module has a playground, a graded lab and a knowledge check.'
  certification:
    name: Certified Kubernetes Security Specialist
    code: CKS
    provider: CNCF / Linux Foundation
    domain: Supply Chain Security
    weight: 20
    competencies:
    - Minimize base image footprint
    - Understand your supply chain (e.g. SBOM, CI/CD, artifact repositories)
    - Secure your supply chain (permitted registries, sign and validate artifacts,
      etc.)
    - Perform static analysis of user workloads and container images (e.g. Kubesec,
      KubeLinter)
