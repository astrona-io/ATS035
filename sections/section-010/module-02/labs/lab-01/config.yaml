apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-010-02-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: pod-security-context
    description: restricted-runner runs as non-root user 10001 with the RuntimeDefault seccomp profile
    type: file
    source: validation/validate-pod-security-context.sh
    points: 1
  - name: container-security-context
    description: Container app blocks privilege escalation, has a read-only root filesystem and drops ALL capabilities
    type: file
    source: validation/validate-container-security-context.sh
    points: 1
  - name: runtime-enforced
    description: Inside restricted-runner the user ID is 10001 and a write to / fails
    type: file
    source: validation/validate-runtime-enforced.sh
    points: 1
