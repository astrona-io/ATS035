apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-010-02-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: loader-recorded
    description: base-image-report records the musl loader path that a running probe pod lists
    type: file
    source: validation/validate-loader-recorded.sh
    points: 1
  - name: package-count-recorded
    description: base-image-report records the apk package count of a running probe pod
    type: file
    source: validation/validate-package-count-recorded.sh
    points: 1
  - name: beacon-on-busybox
    description: The beacon Deployment runs busybox:1.37.0 with its command unchanged, and its container has no apk and no python
    type: file
    source: validation/validate-beacon-on-busybox.sh
    points: 1
  - name: beacon-still-works
    description: The ready beacon pod on BusyBox still prints the probe response
    type: file
    source: validation/validate-beacon-still-works.sh
    points: 1
