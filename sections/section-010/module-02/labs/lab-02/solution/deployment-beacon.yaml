apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon
  namespace: starfleet-035-010-02-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon
  template:
    metadata:
      labels:
        app: beacon
    spec:
      containers:
      - name: beacon
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - while true; do wget -qO- -T 3 http://probe/ || echo probe-unreachable; sleep 5; done
