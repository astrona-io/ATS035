apiVersion: v1
kind: ConfigMap
metadata:
  name: minimal-site
  namespace: starfleet-035-010-03-03
data:
  index.html: |
    minimal-web-version=v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimal-web
  namespace: starfleet-035-010-03-03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minimal-web
  template:
    metadata:
      labels:
        app: minimal-web
    spec:
      containers:
      - name: web
        image: docker.io/library/busybox@sha256:<DIGEST>
        imagePullPolicy: IfNotPresent
        command:
        - httpd
        - -f
        - -p
        - "8080"
        - -h
        - /site
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: site
          mountPath: /site
          readOnly: true
      volumes:
      - name: site
        configMap:
          name: minimal-site
