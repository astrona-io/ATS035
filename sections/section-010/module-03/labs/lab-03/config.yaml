apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-010-03-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    # BusyBox is not preloaded: the node pulls it, so the imageID of the
    # shuttle pod carries the registry digest that this lab pins.
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: pinned-deployment
    description: The minimal-web Deployment serves the minimal-site page with httpd from the BusyBox digest of the shuttle pod on the named port http, and its rollout is complete
    type: file
    source: validation/validate-pinned-deployment.sh
    points: 1
  - name: resource-budget
    description: The web container requests CPU and memory, has a 64Mi memory limit, and its cgroup enforces that limit
    type: file
    source: validation/validate-resource-budget.sh
    points: 1
  - name: service-by-name
    description: The minimal-web Service listens on port 80, targets the named port http, and the shuttle pod gets the page through the Service name
    type: file
    source: validation/validate-service-by-name.sh
    points: 1
