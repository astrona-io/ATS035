apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-010-03-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    # BusyBox is not preloaded: the node pulls it, so the pod's imageID
    # carries the registry digest this lab reads.
    preloadImages:
    - docker.io/library/python:3.13-alpine
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: pinned-reference
    description: pinned-runner names busybox by the digest the shuttle pod reports, with no tag
    type: file
    source: validation/validate-pinned-reference.sh
    points: 1
  - name: pinned-running
    description: pinned-runner is Ready and its status reports the same digest
    type: file
    source: validation/validate-pinned-running.sh
    points: 1
