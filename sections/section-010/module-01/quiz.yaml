# Knowledge check for section 010, module 01. Contract:
# schemas/question-bank.schema.json. Keep question ids stable once published.
schema_version: 1
kind: question_bank
id: ats035-010-01
course_id: ATS035
exam_code: CKS
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: section-010/module-01
  title: Minimize The Base Image Footprint
questions:
  - id: ats035-010-01-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Distinguish a tag from a digest."
    source_readings:
      - sections/section-010/module-01/course-01-layers-tags-and-digests.md
    prompt: "Which part of an image reference always selects the same content, even if the publisher pushes a new build?"
    options:
      - id: a
        text: "The tag, for example `1.37.0`"
        explanation: "A publisher can move a tag to different content at any time."
      - id: b
        text: "The digest, written as `@sha256:` and a hash"
        explanation: "Correct. A digest is the hash of the manifest, so different content has a different digest."
      - id: c
        text: "The repository name"
        explanation: "The repository name selects a collection of images, not one build."
      - id: d
        text: "The `imagePullPolicy` field"
        explanation: "The pull policy decides when the node pulls, not which content a reference selects."
    correct_option: b
    explanation: "A digest is computed from the content. A tag is only a name that can be moved."

  - id: ats035-010-01-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Find which image content a running container uses."
    source_readings:
      - sections/section-010/module-01/course-01-layers-tags-and-digests.md
    prompt: "You must record exactly which image content a running container started from. Which pod field do you read?"
    options:
      - id: a
        text: "`spec.containers[].image`"
        explanation: "This field holds the reference you asked for, often a tag that can move."
      - id: b
        text: "`spec.containers[].imagePullPolicy`"
        explanation: "This field holds the pull policy, not an image identity."
      - id: c
        text: "`metadata.labels`"
        explanation: "Labels are free text and do not come from the container runtime."
      - id: d
        text: "`status.containerStatuses[].imageID`"
        explanation: "Correct. The container runtime reports the resolved content, normally with the repository digest."
    correct_option: d
    explanation: "The `imageID` field in the pod status shows what the runtime resolved. The spec only shows the request."

  - id: ats035-010-01-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what a multi-stage build removes from the final image."
    source_readings:
      - sections/section-010/module-01/course-02-multi-stage-builds-and-minimal-base-images.md
    prompt: "Why does a multi-stage build produce a smaller and safer final image?"
    options:
      - id: a
        text: "Only the files copied with `COPY --from` reach the final stage, so the compiler and build files stay out"
        explanation: "Correct. The earlier stages are not part of the final image."
      - id: b
        text: "The engine compresses every layer twice"
        explanation: "Compression is not what changes the content of the image."
      - id: c
        text: "The final stage gets a newer kernel"
        explanation: "Images do not contain a kernel. The node kernel runs the container."
      - id: d
        text: "The engine deletes the source code after the build in every case"
        explanation: "The engine does not delete anything in a single-stage build."
    correct_option: a
    explanation: "Each stage starts a new filesystem. The final image has only the last stage plus what it copied."

  - id: ats035-010-01-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick the right final base image for a static binary."
    source_readings:
      - sections/section-010/module-01/course-02-multi-stage-builds-and-minimal-base-images.md
    prompt: "A team ships a Go service compiled with `CGO_ENABLED=0`. It must run as non-root, and the image must have no shell or package manager. Which final base image fits?"
    options:
      - id: a
        text: "`docker.io/library/ubuntu`"
        explanation: "Ubuntu has a shell and a package manager, which the team wants to remove."
      - id: b
        text: "`gcr.io/distroless/static-debian12:nonroot`"
        explanation: "Correct. It holds no shell, no package manager and defaults to a non-root user, and a static binary needs nothing more."
      - id: c
        text: "`docker.io/library/golang`"
        explanation: "This is the build image with the whole toolchain."
      - id: d
        text: "`docker.io/library/alpine`"
        explanation: "Alpine is small but includes BusyBox and `apk`."
    correct_option: b
    explanation: "A static binary runs on distroless `static` or `scratch`. The `nonroot` tag sets the user."

  - id: ats035-010-01-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why a secret removed in a later instruction stays in the image."
    source_readings:
      - sections/section-010/module-01/course-03-hardening-a-dockerfile.md
    prompt: "A Dockerfile has `COPY token.txt /token.txt` and, in the next instruction, `RUN rm /token.txt`. The final image has no `/token.txt`. Is the token safe?"
    options:
      - id: a
        text: "Yes, because the final filesystem has no such file"
        explanation: "The file is hidden in the final view only."
      - id: b
        text: "Yes, but only if the image is pushed over TLS"
        explanation: "TLS protects transport and does not change what the layers contain."
      - id: c
        text: "No, because the `COPY` layer still contains the file and anyone who pulls the image can extract it"
        explanation: "Correct. Layers are permanent archives, and the history also records the instruction."
      - id: d
        text: "No, but only if the registry is public"
        explanation: "A private registry limits who can pull but the layer still holds the secret."
    correct_option: c
    explanation: "Use a secret mount (`RUN --mount=type=secret`) so the value is never written into a layer."

  - id: ats035-010-01-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use numeric users with runAsNonRoot."
    source_readings:
      - sections/section-010/module-01/course-03-hardening-a-dockerfile.md
      - sections/section-010/module-01/course-04-running-minimal-images-in-a-cluster.md
    prompt: "A pod sets `runAsNonRoot: true`. The image has `USER app` and no `runAsUser` in the pod. The container fails to start with an error that the user cannot be verified. What is the best fix?"
    options:
      - id: a
        text: "Remove `runAsNonRoot` from the pod"
        explanation: "This hides the check and permits root."
      - id: b
        text: "Set `privileged: true`"
        explanation: "This makes the container less safe and does not address the user."
      - id: c
        text: "Use `imagePullPolicy: Always`"
        explanation: "The pull policy does not affect how the user is verified."
      - id: d
        text: "Use a numeric `USER` in the image or set `runAsUser` in the pod"
        explanation: "Correct. The kubelet can verify a numeric user ID is not 0, but it cannot map a name."
    correct_option: d
    explanation: "The kubelet checks user IDs. A user name is not enough for that check."

  - id: ats035-010-01-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Debug a pod whose image has no shell."
    source_readings:
      - sections/section-010/module-01/course-04-running-minimal-images-in-a-cluster.md
    prompt: "A production pod runs a distroless image. `kubectl exec -it pod -- sh` fails. You must inspect the running processes without changing the image. What do you do?"
    options:
      - id: a
        text: "Rebuild the image on `ubuntu` and redeploy"
        explanation: "This enlarges the production image to solve a debugging need."
      - id: b
        text: "Run `kubectl debug` with an image that has the tools and `--target` for the application container"
        explanation: "Correct. An ephemeral container adds tools to the running pod without changing the production image."
      - id: c
        text: "Set `readOnlyRootFilesystem: false`"
        explanation: "This does not add a shell."
      - id: d
        text: "Delete the pod until `sh` works"
        explanation: "A new pod from the same image still has no shell."
    correct_option: b
    explanation: "Ephemeral containers keep the production image minimal and bring the tools only when needed."

  - id: ats035-010-01-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell the stages of an image pull failure apart."
    source_readings:
      - sections/section-010/module-01/course-04-running-minimal-images-in-a-cluster.md
    prompt: "A new pod shows `ImagePullBackOff`. What should you read first to choose the fix?"
    options:
      - id: a
        text: "The message of the `Failed` event from `kubectl describe pod`"
        explanation: "Correct. It names the reason: name resolution, missing tag, authorization or platform."
      - id: b
        text: "The Service selector"
        explanation: "Services do not take part in pulling images."
      - id: c
        text: "The readiness probe"
        explanation: "Probes run after the container starts."
      - id: d
        text: "The `resources.limits.memory` value"
        explanation: "Memory limits apply to running containers."
    correct_option: a
    explanation: "The event message decides whether the fix is a name, a tag, credentials or an architecture variant."

  - id: ats035-010-01-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain why a mutable tag with IfNotPresent runs different content."
    source_readings:
      - sections/section-010/module-01/course-04-running-minimal-images-in-a-cluster.md
      - sections/section-010/module-01/course-01-layers-tags-and-digests.md
    prompt: "Two nodes run pods from `registry.example/scout:stable` with the default pull policy. The publisher moved the tag last week. The pods behave differently. What is the most likely cause?"
    options:
      - id: a
        text: "The pods use different Service accounts"
        explanation: "Service accounts do not change the image content."
      - id: b
        text: "Each node kept the content it pulled first, because `IfNotPresent` reuses an image held under the same reference"
        explanation: "Correct. The tag is not `latest`, so the default is `IfNotPresent`, and the nodes pulled at different times."
      - id: c
        text: "The registry always serves different content to each node"
        explanation: "A registry serves the content the tag points to at the time of the pull."
      - id: d
        text: "The scheduler rewrites the tag"
        explanation: "The scheduler does not change image references."
    correct_option: b
    explanation: "A digest reference removes the problem, because only content with that digest matches."

  - id: ats035-010-01-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Judge image size against freshness."
    source_readings:
      - sections/section-010/module-01/course-02-multi-stage-builds-and-minimal-base-images.md
    prompt: "A team shrinks an image to a quarter of its size by moving to a small base image, but never rebuilds it. A year later a scanner reports many findings. What does this show?"
    options:
      - id: a
        text: "Small images cannot be scanned"
        explanation: "Scanners work on small images too."
      - id: b
        text: "A small image on an unpatched base still carries the known vulnerabilities of that base"
        explanation: "Correct. Size reduces exposure, but fixes come only from rebuilding on a current base."
      - id: c
        text: "Multi-stage builds add vulnerabilities"
        explanation: "A multi-stage build does not add packages to the final image."
      - id: d
        text: "The digest changed because of the scan"
        explanation: "A scan does not change the image or its digest."
    correct_option: b
    explanation: "Footprint and freshness are separate. Rebuild regularly on a patched base."
