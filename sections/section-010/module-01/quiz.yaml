# Knowledge check for section 010. Contract: schemas/question-bank.schema.json.
# Keep question ids stable once published.
schema_version: 1
kind: question_bank
id: ats035-010-01
course_id: ATS035
exam_code: CKS
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: Minimize base image footprint
questions:
  - id: ats035-010-01-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Distinguish a tag from a digest."
    source_readings:
      - sections/section-010/module-01/course-01-layers-tags-and-digests.md
    prompt: "Which part of an image reference always selects the same content, even if the publisher pushes a new build?"
    options:
      - id: a
        text: "The tag, for example `1.37.0`"
        explanation: "A publisher can move a tag to different content at any time."
      - id: b
        text: "The digest, written as `@sha256:` and a hash"
        explanation: "Correct. A digest is the hash of the manifest, so different content has a different digest."
      - id: c
        text: "The repository name"
        explanation: "The repository name selects a collection of images, not one build."
      - id: d
        text: "The `imagePullPolicy` field"
        explanation: "The pull policy decides when the node pulls, not which content a reference selects."
    correct_option: b
    explanation: "A digest is computed from the content. A tag is only a name that can be moved."

  - id: ats035-010-01-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what a multi-stage build removes from the final image."
    source_readings:
      - sections/section-010/module-01/course-02-multi-stage-builds-and-minimal-base-images.md
    prompt: "Why does a multi-stage build produce a smaller and safer final image?"
    options:
      - id: a
        text: "Only the files copied with `COPY --from` reach the final stage, so the compiler and build files stay out"
        explanation: "Correct. The earlier stages are not part of the final image."
      - id: b
        text: "The engine compresses every layer twice"
        explanation: "Compression is not what changes the content of the image."
      - id: c
        text: "The final stage gets a newer kernel"
        explanation: "Images do not contain a kernel. The node kernel runs the container."
      - id: d
        text: "The engine deletes the source code after the build in every case"
        explanation: "The engine does not delete anything in a single-stage build."
    correct_option: a
    explanation: "Each stage starts a new filesystem. The final image has only the last stage plus what it copied."

  - id: ats035-010-01-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why a secret removed in a later instruction stays in the image."
    source_readings:
      - sections/section-010/module-01/course-03-hardening-a-dockerfile.md
    prompt: "A Dockerfile has `COPY token.txt /token.txt` and, in the next instruction, `RUN rm /token.txt`. The final image has no `/token.txt`. Is the token safe?"
    options:
      - id: a
        text: "Yes, because the final filesystem has no such file"
        explanation: "The file is hidden in the final view only."
      - id: b
        text: "Yes, but only if the image is pushed over TLS"
        explanation: "TLS protects transport and does not change what the layers contain."
      - id: c
        text: "No, because the `COPY` layer still contains the file and anyone who pulls the image can extract it"
        explanation: "Correct. Layers are permanent archives, and the history also records the instruction."
      - id: d
        text: "No, but only if the registry is public"
        explanation: "A private registry limits who can pull but the layer still holds the secret."
    correct_option: c
    explanation: "Use a secret mount (`RUN --mount=type=secret`) so the value is never written into a layer."

  - id: ats035-010-01-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use numeric users with runAsNonRoot."
    source_readings:
      - sections/section-010/module-01/course-03-hardening-a-dockerfile.md
      - sections/section-010/module-01/course-04-running-minimal-images-in-a-cluster.md
    prompt: "A pod sets `runAsNonRoot: true`. The image has `USER app` and no `runAsUser` in the pod. The container fails to start with an error that the user cannot be verified. What is the best fix?"
    options:
      - id: a
        text: "Remove `runAsNonRoot` from the pod"
        explanation: "This hides the check and permits root."
      - id: b
        text: "Set `privileged: true`"
        explanation: "This makes the container less safe and does not address the user."
      - id: c
        text: "Use `imagePullPolicy: Always`"
        explanation: "The pull policy does not affect how the user is verified."
      - id: d
        text: "Use a numeric `USER` in the image or set `runAsUser` in the pod"
        explanation: "Correct. The kubelet can verify a numeric user ID is not 0, but it cannot map a name."
    correct_option: d
    explanation: "The kubelet checks user IDs. A user name is not enough for that check."

  - id: ats035-010-01-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe what the scratch base image contains."
    source_readings:
      - sections/section-010/module-02/course-01-what-each-base-image-contains.md
    prompt: "Which base image contains no files at all, so that only a static binary can run on it?"
    options:
      - id: a
        text: "`debian:bookworm-slim`"
        explanation: "This image holds a full user space with a shell and the `apt` package manager."
      - id: b
        text: "`alpine`"
        explanation: "This image holds BusyBox, the musl library and the `apk` package manager."
      - id: c
        text: "`scratch`"
        explanation: "Correct. It is empty, so a program runs on it only if it is a static binary."
      - id: d
        text: "A distroless base image"
        explanation: "Distroless images hold the files a program needs, such as CA certificates and a passwd file."
    correct_option: c
    explanation: "The `scratch` image is empty. A dynamic binary fails there because its loader and libraries are missing."

  - id: ats035-010-01-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the difference between the musl and glibc C libraries."
    source_readings:
      - sections/section-010/module-02/course-01-what-each-base-image-contains.md
    prompt: "A binary built against `glibc` is copied to an Alpine image. The file exists, but the container fails at start with a message that the file is not found. What is the most likely cause?"
    options:
      - id: a
        text: "The binary asks for a `glibc` dynamic loader that does not exist on a `musl` based image"
        explanation: "Correct. The missing file is the loader that the binary names, not the binary itself."
      - id: b
        text: "The root filesystem is read-only"
        explanation: "A read-only filesystem blocks writes and does not hide an existing file."
      - id: c
        text: "The pod has no seccomp profile"
        explanation: "A missing seccomp profile does not stop a program from loading."
      - id: d
        text: "The image tag is `latest`"
        explanation: "The tag does not change how a binary loads its libraries."
    correct_option: a
    explanation: "`musl` and `glibc` are different C libraries. A dynamic binary needs the loader and libraries that it was linked against."

  - id: ats035-010-01-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Restrict a pod with a non-root numeric user."
    source_readings:
      - sections/section-010/module-02/course-02-measure-what-a-running-container-can-reach.md
    prompt: "Which pod settings make the kubelet refuse a container that would run as root and give the process a user ID that it can verify?"
    options:
      - id: a
        text: "`readOnlyRootFilesystem: true` and `privileged: false`"
        explanation: "These settings limit writes and privilege, but they do not choose the user."
      - id: b
        text: "`allowPrivilegeEscalation: false` only"
        explanation: "This setting blocks gaining rights, but a process can still start as root."
      - id: c
        text: "`seccompProfile: RuntimeDefault` only"
        explanation: "This setting filters system calls and does not choose the user."
      - id: d
        text: "`runAsNonRoot: true` with a numeric `runAsUser`"
        explanation: "Correct. The kubelet can compare a number with 0, but it cannot verify a name."
    correct_option: d
    explanation: "`runAsNonRoot` checks the numeric user ID. A numeric `runAsUser` gives it something to check."

  - id: ats035-010-01-q14
    type: single_choice
    difficulty: advanced
    learning_objective: "Run a program that must write with a read-only root filesystem."
    source_readings:
      - sections/section-010/module-02/course-02-measure-what-a-running-container-can-reach.md
    prompt: "A pod sets `readOnlyRootFilesystem: true`. The application crashes because it writes cache files to `/var/cache/app`. What is the best fix?"
    options:
      - id: a
        text: "Remove `readOnlyRootFilesystem` from the container"
        explanation: "This restores the writable root filesystem for every path, not only the cache."
      - id: b
        text: "Run the container as root"
        explanation: "Root can still not write to a read-only filesystem, and root adds risk."
      - id: c
        text: "Mount an `emptyDir` volume at `/var/cache/app`"
        explanation: "Correct. Only the cache path is writable and the rest of the root filesystem stays read-only."
      - id: d
        text: "Add the `CHOWN` capability"
        explanation: "A capability does not make a read-only filesystem writable."
    correct_option: c
    explanation: "A writable volume at the one path that needs it keeps the benefit of a read-only root filesystem."

  - id: ats035-010-01-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain how a digest and a tag work together in a reference."
    source_readings:
      - sections/section-010/module-03/course-01-pin-images-by-digest-and-keep-the-pin-current.md
    prompt: "An image reference is `busybox:1.37.0@sha256:<digest>`. Which statement is correct?"
    options:
      - id: a
        text: "The runtime uses the tag and ignores the digest"
        explanation: "The digest is the identity, so the runtime uses it."
      - id: b
        text: "The runtime uses the digest and ignores the tag, which only helps a reader"
        explanation: "Correct. The digest selects the content and the runtime rejects bytes that do not match it."
      - id: c
        text: "The reference is invalid because it has both parts"
        explanation: "A reference may carry both, and update tools rely on this form."
      - id: d
        text: "The runtime pulls both and keeps the newer image"
        explanation: "The runtime does not compare two images."
    correct_option: b
    explanation: "A digest selects exact content. The tag stays as a readable hint that update tools can use."

  - id: ats035-010-01-q16
    type: single_choice
    difficulty: advanced
    learning_objective: "Describe how a base image fix reaches a running workload."
    source_readings:
      - sections/section-010/module-03/course-02-pull-policy-rebuild-cadence-and-size-budgets.md
    prompt: "The publisher fixes a vulnerability in the base image. Your workload runs an image built on the old base and pinned by digest. What must happen before the fix runs in the cluster?"
    options:
      - id: a
        text: "Nothing, because the registry updates every pinned image"
        explanation: "A registry never changes content that a digest selects."
      - id: b
        text: "Restart the pods so the node pulls the fix"
        explanation: "A restart starts the same pinned content again."
      - id: c
        text: "Change `imagePullPolicy` to `Always`"
        explanation: "The digest still selects the old content."
      - id: d
        text: "Rebuild the image on the new base, publish its new digest and redeploy with that digest"
        explanation: "Correct. The fix exists only in new layers, so a rebuild, a new digest and a redeployment are needed."
    correct_option: d
    explanation: "An image keeps the base layers from its build time. A new digest in the manifest replaces the old content."
