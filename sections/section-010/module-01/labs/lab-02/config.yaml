apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-010-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # The task builds and runs an image with Docker on the host, so the lab
  # runs in a VM. The image also carries a one-node kubeadm cluster, which
  # the context guard and the shared grader use.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: built-image
    description: A fresh multi-stage build produces a small final filesystem without build tools
    type: file
    source: vm/validate-built-image.sh
    points: 1
  - name: running-image
    description: The built image serves HTTP as a non-root user with a read-only root filesystem
    type: file
    source: vm/validate-running-image.sh
    points: 1
