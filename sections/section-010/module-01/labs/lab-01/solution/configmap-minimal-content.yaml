apiVersion: v1
kind: ConfigMap
metadata:
  name: minimal-content
  namespace: starfleet-035-010-01-01
data:
  index.html: 'minimal-version=v1

    '
---
apiVersion: v1
kind: Pod
metadata:
  name: minimal-server
  namespace: starfleet-035-010-01-01
spec:
  restartPolicy: Never
  containers:
  - name: web
    image: docker.io/library/busybox:1.37.0
    command:
    - httpd
    - -f
    - -p
    - '8080'
    - -h
    - /site
    volumeMounts:
    - name: site
      mountPath: /site
      readOnly: true
  volumes:
  - name: site
    configMap:
      name: minimal-content
