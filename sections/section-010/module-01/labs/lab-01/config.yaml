apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-010-01-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: minimal-content
    description: ConfigMap minimal-content holds index.html with minimal-version=v1
    type: file
    source: validation/validate-minimal-content.sh
    points: 1
  - name: minimal-server
    description: Pod minimal-server runs BusyBox httpd on 8080 with a read-only content mount and no Python
    type: file
    source: validation/validate-minimal-server.sh
    points: 1
  - name: serves-page
    description: The shuttle pod receives the page from minimal-server
    type: file
    source: validation/validate-serves-page.sh
    points: 1
