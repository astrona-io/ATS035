questions:
- id: ats035-final-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish a tag from a digest.
  source_readings:
  - sections/section-010/module-01/course-01-layers-tags-and-digests.md
  prompt: Which part of an image reference always selects the same content, even if
    the publisher pushes a new build?
  options:
  - id: a
    text: The tag, for example `1.37.0`
    explanation: A publisher can move a tag to different content at any time.
  - id: b
    text: The digest, written as `@sha256:` and a hash
    explanation: Correct. A digest is the hash of the manifest, so different content
      has a different digest.
  - id: c
    text: The repository name
    explanation: The repository name selects a collection of images, not one build.
  - id: d
    text: The `imagePullPolicy` field
    explanation: The pull policy decides when the node pulls, not which content a
      reference selects.
  correct_option: b
  explanation: A digest is computed from the content. A tag is only a name that can
    be moved.
- id: ats035-final-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Restrict a pod with a non-root numeric user.
  source_readings:
  - sections/section-010/module-02/course-02-measure-what-a-running-container-can-reach.md
  prompt: Which pod settings make the kubelet refuse a container that would run as
    root and give the process a user ID that it can verify?
  options:
  - id: a
    text: "`readOnlyRootFilesystem: true` and `privileged: false`"
    explanation: These settings limit writes and privilege, but they do not choose
      the user.
  - id: b
    text: "`allowPrivilegeEscalation: false` only"
    explanation: This setting blocks gaining rights, but a process can still start
      as root.
  - id: c
    text: "`seccompProfile: RuntimeDefault` only"
    explanation: This setting filters system calls and does not choose the user.
  - id: d
    text: "`runAsNonRoot: true` with a numeric `runAsUser`"
    explanation: Correct. The kubelet can compare a number with 0, but it cannot verify
      a name.
  correct_option: d
  explanation: "`runAsNonRoot` checks the numeric user ID. A numeric `runAsUser` gives
    it something to check."
- id: ats035-final-q03
  type: single_choice
  difficulty: advanced
  learning_objective: Describe how a base image fix reaches a running workload.
  source_readings:
  - sections/section-010/module-03/course-02-pull-policy-rebuild-cadence-and-size-budgets.md
  prompt: The publisher fixes a vulnerability in the base image. Your workload runs
    an image built on the old base and pinned by digest. What must happen before the
    fix runs in the cluster?
  options:
  - id: a
    text: Nothing, because the registry updates every pinned image
    explanation: A registry never changes content that a digest selects.
  - id: b
    text: Restart the pods so the node pulls the fix
    explanation: A restart starts the same pinned content again.
  - id: c
    text: Change `imagePullPolicy` to `Always`
    explanation: The digest still selects the old content.
  - id: d
    text: Rebuild the image on the new base, publish its new digest and redeploy with
      that digest
    explanation: Correct. The fix exists only in new layers, so a rebuild, a new digest
      and a redeployment are needed.
  correct_option: d
  explanation: An image keeps the base layers from its build time. A new digest in
    the manifest replaces the old content.
- id: ats035-final-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Name what an SBOM proves.
  source_readings:
  - sections/section-020/module-01/course-02-software-bills-of-materials-with-syft.md
  prompt: What does a software bill of materials (SBOM) tell you about an image?
  options:
  - id: a
    text: The components inside it, with versions
    explanation: Correct. It is a list of components. Vulnerability status needs a
      separate scan.
  - id: b
    text: Whether the image is free of vulnerabilities
    explanation: An SBOM lists components and does not match them to vulnerability
      data.
  - id: c
    text: Who signed the image
    explanation: A signature is separate evidence.
  - id: d
    text: Which pipeline built the image
    explanation: That is provenance, a separate statement.
  correct_option: a
  explanation: An SBOM answers what is in the artifact.
- id: ats035-final-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Split a package line from `apk info -v` into name and version.
  source_readings:
  - sections/section-020/module-02/course-01-reading-spdx-and-cyclonedx-documents.md
  prompt: A line from `apk info -v` reads `ca-certificates-bundle-20240705-r0`. What
    is the package name?
  options:
  - id: a
    text: "`ca`"
    explanation: Splitting at the first dash cuts the name too early.
  - id: b
    text: "`ca-certificates-bundle-20240705`"
    explanation: This keeps the version `20240705` in the name. The version and release
      are the last two parts.
  - id: c
    text: "`ca-certificates`"
    explanation: The word `bundle` is part of the name.
  - id: d
    text: "`ca-certificates-bundle`"
    explanation: Correct. The version and release are the last two dash-separated
      parts.
  correct_option: d
  explanation: The name is everything before the last two dashes.
- id: ats035-final-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Separate push rights from pull rights on a registry.
  source_readings:
  - sections/section-020/module-03/course-01-registries-repositories-and-who-may-push-or-pull.md
  prompt: Which registry design limits the damage when the cluster pull credential
    leaks?
  options:
  - id: a
    text: One administrator account shared by the pipeline and the cluster
    explanation: A leak then gives write and delete rights to every repository.
  - id: b
    text: A password that never changes, stored in every namespace
    explanation: Wide distribution and no rotation increase the risk.
  - id: c
    text: Anonymous pull access for the production repositories
    explanation: Anyone could then read the images.
  - id: d
    text: A read-only identity limited to the repositories the workload needs
    explanation: Correct. A leaked pull credential cannot push or delete.
  correct_option: d
  explanation: Give each purpose its own narrow identity.
- id: ats035-final-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Place admission in the request path.
  source_readings:
  - sections/section-030/module-01/course-01-the-admission-pipeline-and-validatingadmissionpolicy.md
  prompt: In which order does the API server process a create request?
  options:
  - id: a
    text: Validating admission, mutating admission, authorization, authentication
    explanation: This order is reversed.
  - id: b
    text: Authentication, authorization, mutating admission, schema validation, validating
      admission
    explanation: Correct. Validating admission runs last, so it sees the final object.
  - id: c
    text: Authorization, mutating admission, authentication, validating admission
    explanation: Authentication comes before authorization.
  - id: d
    text: Mutating admission, authentication, validating admission, authorization
    explanation: Admission runs after authentication and authorization.
  correct_option: b
  explanation: Mutation runs before validation so that rules check the final object.
- id: ats035-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: State what a digest rule can and cannot check.
  source_readings:
  - sections/section-030/module-02/course-01-a-digest-rule-with-validatingadmissionpolicy.md
  prompt: Can a ValidatingAdmissionPolicy confirm that the digest in an image reference
    exists in the registry?
  options:
  - id: a
    text: No. The API server only reads the text of the reference and does not pull
      images
    explanation: Correct. CEL has no registry access.
  - id: b
    text: Yes. The API server pulls the manifest before admission
    explanation: The API server does not pull images; nodes do.
  - id: c
    text: Yes, when the binding uses `Deny`
    explanation: The validation action does not add registry access.
  - id: d
    text: Yes, when `failurePolicy` is `Fail`
    explanation: "`failurePolicy` decides what happens on evaluation errors only."
  correct_option: a
  explanation: The rule checks the form of the reference. A signature check or a pull
    is needed to learn more.
- id: ats035-final-q09
  type: single_choice
  difficulty: advanced
  learning_objective: Explain the effect of defaultAllow on ImagePolicyWebhook.
  source_readings:
  - sections/section-030/module-03/course-02-the-imagepolicywebhook-admission-plugin.md
  prompt: 'ImagePolicyWebhook is enabled with `defaultAllow: true`, and its backend
    service is down. What happens to new pods?'
  options:
  - id: a
    text: The plugin admits them without an image decision, so the check fails open
    explanation: Correct. Users see no error and the control is off.
  - id: b
    text: The plugin rejects every pod
    explanation: 'That is the result of `defaultAllow: false`.'
  - id: c
    text: The API server stops until the backend returns
    explanation: The API server keeps running and applies the default.
  - id: d
    text: Only pods from private registries are rejected
    explanation: The default does not depend on the registry.
  correct_option: a
  explanation: 'Security controls use `defaultAllow: false` so that an outage blocks
    pods instead of disabling the check.'
- id: ats035-final-q10
  type: single_choice
  difficulty: beginner
  learning_objective: Choose the Trivy command for an input.
  source_readings:
  - sections/section-040/module-02/course-01-what-trivy-scans-images-folders-and-configuration.md
  prompt: You want to find risky settings, such as a privileged container, in a folder
    of Kubernetes manifests. Which command fits?
  options:
  - id: a
    text: "`trivy image` with the image name"
    explanation: It reads the packages inside an image, not the settings in a manifest.
  - id: b
    text: "`trivy fs` with the folder and the default scanners"
    explanation: It looks for vulnerable dependencies and secrets, not for manifest
      misconfigurations.
  - id: c
    text: "`trivy config` with the folder"
    explanation: Correct. The `config` command applies misconfiguration rules to Kubernetes
      YAML.
  - id: d
    text: "`trivy version`"
    explanation: It prints version information and scans nothing.
  correct_option: c
  explanation: 'Each Trivy command reads a different input: image, folder or configuration.'
- id: ats035-final-q11
  type: single_choice
  difficulty: beginner
  learning_objective: Name the Pod Security Standards.
  source_readings:
  - sections/section-040/module-03/course-01-the-pod-security-standards.md
  prompt: Which list names the three Pod Security Standards from least to most strict?
  options:
  - id: a
    text: "`open`, `closed`, `locked`"
    explanation: These are not Pod Security Standard names.
  - id: b
    text: "`audit`, `warn`, `enforce`"
    explanation: These are modes, not standards.
  - id: c
    text: "`restricted`, `baseline`, `privileged`"
    explanation: This lists the standards from most to least strict.
  - id: d
    text: "`privileged`, `baseline`, `restricted`"
    explanation: Correct. Each level contains the limits of the one before it.
  correct_option: d
  explanation: privileged has no limits, baseline blocks known escalation paths, and
    restricted adds hardening requirements.
- id: ats035-final-q12
  type: single_choice
  difficulty: advanced
  learning_objective: Fix a pod that fails the restricted standard.
  source_readings:
  - sections/section-040/module-03/course-03-meeting-restricted-exemptions-and-limits.md
  prompt: 'A pod sets only `runAsNonRoot: true` and `runAsUser: 1000`. It is rejected
    in a `restricted` namespace. Which set of changes fixes it?'
  options:
  - id: a
    text: 'Add `privileged: false` and `readOnlyRootFilesystem: true`'
    explanation: No standard requires a read-only file system, and the other required
      fields are still missing.
  - id: b
    text: 'Add `allowPrivilegeEscalation: false`, drop all capabilities and set the
      `RuntimeDefault` seccomp profile'
    explanation: Correct. These are the remaining requirements of the restricted standard.
  - id: c
    text: Label the namespace with `warn` instead of `enforce`
    explanation: This lets the pod in but does not make it meet the standard.
  - id: d
    text: 'Set `hostNetwork: true`'
    explanation: Host networking is forbidden by baseline and restricted.
  correct_option: b
  explanation: The error message lists every violated field, and the fix is to set
    each of them.
