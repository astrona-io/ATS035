apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-030-01-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: registry-policy
    description: ValidatingAdmissionPolicy training-registry checks every container list, bound with Deny to the labelled namespaces
    type: file
    source: validation/validate-registry-policy.sh
    points: 2
  - name: unapproved-rejected
    description: approved-images-035-030-01-01 is labelled and rejects an unapproved.example image with the policy message
    type: file
    source: validation/validate-unapproved-rejected.sh
    points: 1
  - name: approved-reader
    description: Pod approved-reader from docker.io/library is Ready in approved-images-035-030-01-01
    type: file
    source: validation/validate-approved-reader.sh
    points: 1
