apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-030-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # The task signs an image in a registry that Docker runs on the host, so
  # the lab runs in a VM. The image also carries a one-node kubeadm cluster,
  # which the context guard and the shared grader use.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: image-signature
    description: The supplied immutable image digest has a valid signature under the training public key
    type: file
    source: vm/validate-image-signature.sh
    points: 1
  - name: trust-boundary
    description: A different key and a different unsigned image cannot pass the same verification
    type: file
    source: vm/validate-trust-boundary.sh
    points: 1
