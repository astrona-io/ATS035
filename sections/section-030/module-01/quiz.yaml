# Knowledge check for section 030, covering modules 01 to 03. Contract:
# schemas/question-bank.schema.json. Keep question ids stable once published.
schema_version: 1
kind: question_bank
id: ats035-030-01
course_id: ATS035
exam_code: CKS
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: Secure your supply chain (permitted registries, sign and validate artifacts, etc.)
questions:
  - id: ats035-030-01-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Place admission in the request path."
    source_readings:
      - sections/section-030/module-01/course-01-the-admission-pipeline-and-validatingadmissionpolicy.md
    prompt: "In which order does the API server process a create request?"
    options:
      - id: a
        text: "Validating admission, mutating admission, authorization, authentication"
        explanation: "This order is reversed."
      - id: b
        text: "Authentication, authorization, mutating admission, schema validation, validating admission"
        explanation: "Correct. Validating admission runs last, so it sees the final object."
      - id: c
        text: "Authorization, mutating admission, authentication, validating admission"
        explanation: "Authentication comes before authorization."
      - id: d
        text: "Mutating admission, authentication, validating admission, authorization"
        explanation: "Admission runs after authentication and authorization."
    correct_option: b
    explanation: "Mutation runs before validation so that rules check the final object."

  - id: ats035-030-01-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what makes a ValidatingAdmissionPolicy active."
    source_readings:
      - sections/section-030/module-01/course-01-the-admission-pipeline-and-validatingadmissionpolicy.md
    prompt: "A cluster administrator creates a ValidatingAdmissionPolicy and sees no effect on new pods. What is missing?"
    options:
      - id: a
        text: "A ValidatingAdmissionPolicyBinding that names the policy"
        explanation: "Correct. The binding turns the policy on and sets the actions."
      - id: b
        text: "A restart of the kube-apiserver"
        explanation: "Policies take effect without a restart."
      - id: c
        text: "A webhook certificate"
        explanation: "A policy runs inside the API server and needs no certificate."
      - id: d
        text: "A RoleBinding for the policy"
        explanation: "RBAC does not enable policies."
    correct_option: a
    explanation: "Policy plus binding make an active rule."

  - id: ats035-030-01-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Write a digest rule that cannot be bypassed."
    source_readings:
      - sections/section-030/module-02/course-01-a-digest-rule-with-validatingadmissionpolicy.md
    prompt: "Why does the digest rule `i.matches('@sha256:[a-f0-9]{64}$')` end with `$`?"
    options:
      - id: a
        text: "To make the match case-insensitive"
        explanation: "The `$` anchors the end of the string and has no effect on case."
      - id: b
        text: "To make the API server pull the image"
        explanation: "The API server never pulls images."
      - id: c
        text: "So that extra text after the 64 hexadecimal characters does not pass"
        explanation: "Correct. The end anchor makes the digest the last part of the reference."
      - id: d
        text: "To select only pods"
        explanation: "The resource rules select pods, not the regular expression."
    correct_option: c
    explanation: "Without the end anchor, text after a digest-like string would still match the rule."

  - id: ats035-030-01-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "State what a digest rule can and cannot check."
    source_readings:
      - sections/section-030/module-02/course-01-a-digest-rule-with-validatingadmissionpolicy.md
    prompt: "Can a ValidatingAdmissionPolicy confirm that the digest in an image reference exists in the registry?"
    options:
      - id: a
        text: "No. The API server only reads the text of the reference and does not pull images"
        explanation: "Correct. CEL has no registry access."
      - id: b
        text: "Yes. The API server pulls the manifest before admission"
        explanation: "The API server does not pull images; nodes do."
      - id: c
        text: "Yes, when the binding uses `Deny`"
        explanation: "The validation action does not add registry access."
      - id: d
        text: "Yes, when `failurePolicy` is `Fail`"
        explanation: "`failurePolicy` decides what happens on evaluation errors only."
    correct_option: a
    explanation: "The rule checks the form of the reference. A signature check or a pull is needed to learn more."

  - id: ats035-030-01-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write a safe prefix."
    source_readings:
      - sections/section-030/module-01/course-02-enforcing-permitted-registries.md
    prompt: "Which prefix is the safest in a registry rule that uses `startsWith`?"
    options:
      - id: a
        text: "`docker.io/lib`"
        explanation: "It also matches `docker.io/library-evil/app`."
      - id: b
        text: "`library`"
        explanation: "It matches many unrelated strings."
      - id: c
        text: "`docker.io`"
        explanation: "It allows every repository on the registry."
      - id: d
        text: "`docker.io/library/`"
        explanation: "Correct. The trailing slash limits the match to that repository path."
    correct_option: d
    explanation: "End the prefix with a slash."

  - id: ats035-030-01-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the limits of admission-time verification."
    source_readings:
      - sections/section-030/module-02/course-03-enforcing-verification-and-its-limits.md
    prompt: "A cluster verifies image signatures at admission. Which statement about it is correct?"
    options:
      - id: a
        text: "It removes pods whose signature is later revoked"
        explanation: "Admission runs when a pod is created or updated, not continuously."
      - id: b
        text: "A pod admitted earlier keeps running if its signature is removed or the policy changes"
        explanation: "Correct. Running pods are not checked again."
      - id: c
        text: "It proves the image has no vulnerabilities"
        explanation: "A signature says who vouches for the content, not that it is free of vulnerabilities."
      - id: d
        text: "It also covers namespaces that the policy excludes"
        explanation: "An excluded namespace is not checked."
    correct_option: b
    explanation: "Admission is a point-in-time check on new requests. Audit running workloads separately."

  - id: ats035-030-01-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain how a pod receives image pull credentials."
    source_readings:
      - sections/section-030/module-03/course-01-pull-credentials-for-private-registries.md
    prompt: "A pod uses a ServiceAccount whose `imagePullSecrets` lists a registry Secret, and the pod has no `imagePullSecrets` of its own. How does the kubelet get the credentials?"
    options:
      - id: a
        text: "The kubelet reads every Secret in the namespace"
        explanation: "The kubelet uses only the Secrets listed for the pod."
      - id: b
        text: "The container fetches them from the registry at start"
        explanation: "The kubelet pulls the image before the container starts."
      - id: c
        text: "The credentials are copied from the node file system only"
        explanation: "A node-level provider is optional, not required for this case."
      - id: d
        text: "The ServiceAccount admission plugin copies the list into the pod"
        explanation: "Correct. The pod then carries the Secret name in its own specification."
    correct_option: d
    explanation: "The admission plugin adds the ServiceAccount's list, and the kubelet sends the matching credentials to the registry host."

  - id: ats035-030-01-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick the right tool for signature checks."
    source_readings:
      - sections/section-030/module-01/course-03-policy-engines-and-admission-webhooks.md
      - sections/section-030/module-01/course-04-signing-and-verifying-images-with-cosign.md
    prompt: "A team must reject pods whose image has no valid signature from their key. Which choice can do that?"
    options:
      - id: a
        text: "A ValidatingAdmissionPolicy with a CEL expression"
        explanation: "CEL cannot contact a registry to fetch a signature."
      - id: b
        text: "A NetworkPolicy"
        explanation: "NetworkPolicy filters traffic, not admission."
      - id: c
        text: "A Kyverno `verifyImages` rule or a signature-verifying admission controller"
        explanation: "Correct. It checks the signature at admission."
      - id: d
        text: "A readiness probe"
        explanation: "Probes run after the pod starts."
    correct_option: c
    explanation: "Signature checks need an admission webhook that talks to the registry."

  - id: ats035-030-01-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain the effect of defaultAllow on ImagePolicyWebhook."
    source_readings:
      - sections/section-030/module-03/course-02-the-imagepolicywebhook-admission-plugin.md
    prompt: "ImagePolicyWebhook is enabled with `defaultAllow: true`, and its backend service is down. What happens to new pods?"
    options:
      - id: a
        text: "The plugin admits them without an image decision, so the check fails open"
        explanation: "Correct. Users see no error and the control is off."
      - id: b
        text: "The plugin rejects every pod"
        explanation: "That is the result of `defaultAllow: false`."
      - id: c
        text: "The API server stops until the backend returns"
        explanation: "The API server keeps running and applies the default."
      - id: d
        text: "Only pods from private registries are rejected"
        explanation: "The default does not depend on the registry."
    correct_option: a
    explanation: "Security controls use `defaultAllow: false` so that an outage blocks pods instead of disabling the check."

  - id: ats035-030-01-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Tell an audit-only binding from enforcement."
    source_readings:
      - sections/section-030/module-03/course-03-admission-failure-modes-and-exemptions.md
    prompt: "A binding for a registry policy has `validationActions: [\"Audit\"]`. A pod with an unapproved image is created in a selected namespace. What happens?"
    options:
      - id: a
        text: "The pod is rejected with the policy message"
        explanation: "Rejection needs the `Deny` action."
      - id: b
        text: "The client prints a warning and the pod is rejected"
        explanation: "`Warn` adds a client warning and never rejects."
      - id: c
        text: "The pod is admitted and the violation is only recorded for audit"
        explanation: "Correct. Nothing is rejected."
      - id: d
        text: "The policy is ignored and the binding is deleted"
        explanation: "The binding stays and the policy runs."
    correct_option: c
    explanation: "Only `Deny` rejects a request. `Audit` and `Warn` leave the pod admitted."
