schema_version: 1
kind: question_bank
id: ats035-030-02
course_id: ATS035
exam_code: CKS
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: section-030/module-02
  title: "Require Image Digests And Verify Signatures"
placement:
  position: after
  reading: sections/section-030/module-02/course-04-summary.md
questions:
  - id: ats035-030-02-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Identify which container lists a digest rule must check."
    source_readings:
      - sections/section-030/module-02/course-01-a-digest-rule-with-validatingadmissionpolicy.md
    prompt: "A digest rule in a ValidatingAdmissionPolicy checks only `object.spec.containers`. Why is this not enough?"
    options:
      - id: a
        text: "The API server stores the image of `containers` without the digest"
        explanation: "The API server stores the image string as it was sent. It does not remove the digest."
      - id: b
        text: "CEL cannot read the `containers` list of a pod"
        explanation: "CEL can read `object.spec.containers`. The rule in this module does that."
      - id: c
        text: "Init containers and ephemeral containers also run code, so their images must follow the rule too"
        explanation: "Correct. The policy collects the images of `containers`, `initContainers` and `ephemeralContainers` in one variable."
      - id: d
        text: "The kubelet pulls the images of `containers` by tag in every case"
        explanation: "The container runtime uses the digest when the reference has one, so this is not the reason."
    correct_option: c
    explanation: "Every container list in a pod runs code. A rule that skips one list lets a tag-only image run through that list."

  - id: ats035-030-02-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the result of a dry run against a binding in warning mode."
    source_readings:
      - sections/section-030/module-02/course-01-a-digest-rule-with-validatingadmissionpolicy.md
    prompt: "A digest policy has a binding with `validationActions: [\"Warn\", \"Audit\"]`. You run `kubectl apply --dry-run=server` for a pod whose image has a tag and no digest. What do you see?"
    options:
      - id: a
        text: "The request is accepted, and the client prints a `Warning:` line with the policy message"
        explanation: "Correct. `Warn` sends a warning to the client and `Audit` adds an audit annotation. Neither rejects the request."
      - id: b
        text: "The request fails with an error that names the policy"
        explanation: "Only the `Deny` action rejects the request."
      - id: c
        text: "The pod is created and starts on a node"
        explanation: "A server-side dry run stores nothing, so no pod is created."
      - id: d
        text: "Nothing at all, because dry runs skip admission"
        explanation: "A server-side dry run passes through the whole admission chain."
    correct_option: a
    explanation: "Warning mode lets you see which pods would break before you change the action to `Deny`."

  - id: ats035-030-02-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what a server-side dry run does."
    source_readings:
      - sections/section-030/module-02/course-01-a-digest-rule-with-validatingadmissionpolicy.md
    prompt: "Why is `kubectl apply --dry-run=server` a good way to test an admission rule?"
    options:
      - id: a
        text: "It checks only the YAML syntax on your machine"
        explanation: "That describes a client-side check. A server-side dry run reaches the API server."
      - id: b
        text: "It creates the pod and deletes it after one minute"
        explanation: "A dry run never stores the object."
      - id: c
        text: "It pulls the image to check the digest"
        explanation: "The API server does not pull images, in a dry run or otherwise."
      - id: d
        text: "It sends the request through the whole admission chain and stores nothing"
        explanation: "Correct. The policy runs as it would for a real request, but etcd does not receive the object."
    correct_option: d
    explanation: "A server-side dry run gives the real admission answer without creating anything in the cluster."

  - id: ats035-030-02-q04
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict how a pod rule affects a Deployment."
    source_readings:
      - sections/section-030/module-02/course-01-a-digest-rule-with-validatingadmissionpolicy.md
    prompt: "A digest policy matches `pods` and its binding uses `Deny`. You apply a Deployment whose pod template uses `busybox:1.37.0` without a digest. What happens?"
    options:
      - id: a
        text: "The API server rejects the Deployment"
        explanation: "The policy matches pods, not Deployments, so the Deployment itself is not checked."
      - id: b
        text: "The Deployment is admitted, and its ReplicaSet fails to create pods; the reason is in the events"
        explanation: "Correct. The ReplicaSet controller sends the pod create requests, and those requests are denied."
      - id: c
        text: "The pods start, because the Deployment was admitted"
        explanation: "Each pod is a separate create request, and each one is checked by the policy."
      - id: d
        text: "The API server adds the digest to the pod template"
        explanation: "A ValidatingAdmissionPolicy cannot change objects. It only allows or denies."
    correct_option: b
    explanation: "A rule on pods acts when the ReplicaSet creates pods. Read the ReplicaSet events to see the denial."

  - id: ats035-030-02-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Identify where cosign stores an image signature."
    source_readings:
      - sections/section-030/module-02/course-02-signatures-attestations-and-keyless-signing.md
    prompt: "Where does cosign store the signature of an image in the common layout?"
    options:
      - id: a
        text: "Inside the image, as a new layer"
        explanation: "Cosign does not change the image. Changing it would change its digest."
      - id: b
        text: "In an annotation on every pod that uses the image"
        explanation: "Pods do not hold signatures. The verifier reads them from the registry."
      - id: c
        text: "As a separate OCI artifact in the same repository, tagged with the image digest and `.sig`"
        explanation: "Correct. The tag is the digest with the colon replaced by a dash, followed by `.sig`."
      - id: d
        text: "In a ConfigMap in the `kube-system` namespace"
        explanation: "The cluster does not store cosign signatures."
    correct_option: c
    explanation: "The signature sits beside the image in the registry and is linked to it by the digest."

  - id: ats035-030-02-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the parts of an in-toto attestation."
    source_readings:
      - sections/section-030/module-02/course-02-signatures-attestations-and-keyless-signing.md
    prompt: "An attestation is a signed in-toto statement about an image. Which parts does the statement have?"
    options:
      - id: a
        text: "A subject (the image digest), a predicate type and the predicate itself"
        explanation: "Correct. The predicate type says what the statement is, for example an SBOM or build provenance."
      - id: b
        text: "A user name, a password and an `auth` value"
        explanation: "Those are the fields of a registry credential, not of an attestation."
      - id: c
        text: "The image tag, the pull policy and the node name"
        explanation: "An attestation is about content, so it names a digest, not a tag or a node."
      - id: d
        text: "Only the public key of the signer"
        explanation: "The key verifies the signature. It is not the content of the statement."
    correct_option: a
    explanation: "The subject ties the statement to one digest, and the predicate carries the SBOM, scan result or provenance."

  - id: ats035-030-02-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the values a verifier must give for keyless verification."
    source_readings:
      - sections/section-030/module-02/course-02-signatures-attestations-and-keyless-signing.md
    prompt: "An image was signed with keyless signing. Which values must `cosign verify` receive so that only the expected signer passes?"
    options:
      - id: a
        text: "The private key of the signer"
        explanation: "Keyless signing discards the private key after signing, and a verifier never needs a private key."
      - id: b
        text: "Only the image tag"
        explanation: "A tag can move, and it does not say who must have signed."
      - id: c
        text: "The name of the Kubernetes ServiceAccount"
        explanation: "The ServiceAccount is not part of the Sigstore certificate check."
      - id: d
        text: "The certificate identity and the OIDC issuer"
        explanation: "Correct. Without both values, any signer with any identity passes."
    correct_option: d
    explanation: "Keyless verification trusts an identity, so the verifier must name who signed and which provider vouched for it."

  - id: ats035-030-02-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain why a signature follows the digest and not the tag."
    source_readings:
      - sections/section-030/module-02/course-02-signatures-attestations-and-keyless-signing.md
    prompt: "A team signed `app:1.0` at digest A. Later someone pushes new content to the tag `app:1.0`, which now points to digest B. What does a verifier find for digest B?"
    options:
      - id: a
        text: "A valid signature, because the tag was signed"
        explanation: "Cosign signs the digest of the manifest, not the tag."
      - id: b
        text: "No valid signature from the team, because the signature belongs to digest A"
        explanation: "Correct. A tag that moves does not carry the signature to the new content."
      - id: c
        text: "A valid signature, because both digests are in the same repository"
        explanation: "The repository does not matter. The signature names one digest."
      - id: d
        text: "The signature is moved to digest B automatically"
        explanation: "The registry does not move signatures when a tag changes."
    correct_option: b
    explanation: "Verify and run the digest. A signature on one digest says nothing about other content under the same tag."

  - id: ats035-030-02-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the effect of the image pattern in a verification policy."
    source_readings:
      - sections/section-030/module-02/course-03-enforcing-verification-and-its-limits.md
    prompt: "A Kyverno `verifyImages` rule lists `imageReferences: [\"registry.example.com/team/*\"]`. A pod uses `docker.io/library/busybox:1.37.0`. What does the rule do with this image?"
    options:
      - id: a
        text: "It rejects the image because it is not signed"
        explanation: "The rule only checks images that match its patterns."
      - id: b
        text: "It moves the image to `registry.example.com`"
        explanation: "Kyverno can replace a tag with a verified digest, but it does not move images between registries."
      - id: c
        text: "It does not check the image, so the image passes this rule"
        explanation: "Correct. An image outside every pattern is not verified at all."
      - id: d
        text: "It verifies the image with the public key of Docker Hub"
        explanation: "The rule uses only the attestors it lists, and only for matching images."
    correct_option: c
    explanation: "The patterns must cover every registry path you allow, or other paths stay unchecked."

  - id: ats035-030-02-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain how a registry outage affects signature verification at admission."
    source_readings:
      - sections/section-030/module-02/course-03-enforcing-verification-and-its-limits.md
    prompt: "A cluster verifies signatures at admission with a webhook that uses `failurePolicy: Fail`. The registry that holds the signatures is unavailable. What can happen to new pods?"
    options:
      - id: a
        text: "New pods can be blocked, because the verifier needs the registry at admission time"
        explanation: "Correct. The webhook cannot read the signature, so the check fails and the request is rejected."
      - id: b
        text: "New pods are always admitted, because the API server skips the webhook"
        explanation: "With `Fail`, an error in the check rejects the request. Admitting on error is what `Ignore` does."
      - id: c
        text: "Running pods are stopped until the registry returns"
        explanation: "Admission checks new requests only. It does not stop running pods."
      - id: d
        text: "The API server verifies the signature itself with CEL"
        explanation: "CEL has no function that calls a registry or checks a signature."
    correct_option: a
    explanation: "Signature verification depends on the registry. Plan for its availability when you enforce the check."
