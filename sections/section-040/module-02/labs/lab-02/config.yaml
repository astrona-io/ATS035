apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-040-02-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # The task scans an image from the Docker image cache on the host, so the
  # lab runs in a VM. The image also carries a one-node kubeadm cluster,
  # which the context guard and the shared grader use.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: fresh-scan
    description: The report matches a fresh scan of the supplied image with the lab database
    type: file
    source: vm/validate-fresh-scan.sh
    points: 1
  - name: release-decision
    description: The decision records the current image, database timestamp and complete high/critical
      count
    type: file
    source: vm/validate-release-decision.sh
    points: 1
