apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-040-02-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: gate-decision
    description: scan-gate has the decision and the blocking findings
    type: file
    source: validation/validate-gate-decision.sh
    points: 1
  - name: gate-exceptions
    description: scan-gate lists the waived and the unfixed findings
    type: file
    source: validation/validate-gate-exceptions.sh
    points: 1
  - name: gate-settings
    description: scan-gate records severity HIGH,CRITICAL and ignoreUnfixed true, and no other keys
    type: file
    source: validation/validate-gate-settings.sh
    points: 1
