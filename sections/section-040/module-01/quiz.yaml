# Knowledge check for section 040, covering modules 01 to 03. Contract:
# schemas/question-bank.schema.json. Keep question ids stable once published.
schema_version: 1
kind: question_bank
id: ats035-040-01
course_id: ATS035
exam_code: CKS
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: Perform static analysis of user workloads and container images
questions:
  - id: ats035-040-01-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Say what static analysis reads."
    source_readings:
      - sections/section-040/module-01/course-01-what-static-analysis-can-and-cannot-show.md
    prompt: "What does a manifest static check read?"
    options:
      - id: a
        text: "The fields of the YAML or JSON document"
        explanation: "Correct. It never starts the workload."
      - id: b
        text: "The memory of the running container"
        explanation: "That is run-time analysis."
      - id: c
        text: "The network traffic of the pod"
        explanation: "Static tools do not see traffic."
      - id: d
        text: "The logs of the node"
        explanation: "Logs are not an input of a manifest check."
    correct_option: a
    explanation: "Static analysis tests declared fields only."

  - id: ats035-040-01-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Interpret a high score."
    source_readings:
      - sections/section-040/module-01/course-02-scanning-manifests-with-kubesec.md
    prompt: "A Deployment has a high Kubesec score and uses an image with a known critical vulnerability. What follows?"
    options:
      - id: a
        text: "It is safe because the score is high"
        explanation: "The score ignores image content."
      - id: b
        text: "Kubesec will block the image"
        explanation: "Kubesec does not scan images."
      - id: c
        text: "The score is invalid"
        explanation: "The score is valid for the declarations."
      - id: d
        text: "The manifest is well hardened, and the image still needs its own scan"
        explanation: "Correct. Manifest and image evidence are separate."
    correct_option: d
    explanation: "A score ranks declarations only."

  - id: ats035-040-01-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose the Trivy command for an input."
    source_readings:
      - sections/section-040/module-02/course-01-what-trivy-scans-images-folders-and-configuration.md
    prompt: "You want to find risky settings, such as a privileged container, in a folder of Kubernetes manifests. Which command fits?"
    options:
      - id: a
        text: "`trivy image` with the image name"
        explanation: "It reads the packages inside an image, not the settings in a manifest."
      - id: b
        text: "`trivy fs` with the folder and the default scanners"
        explanation: "It looks for vulnerable dependencies and secrets, not for manifest misconfigurations."
      - id: c
        text: "`trivy config` with the folder"
        explanation: "Correct. The `config` command applies misconfiguration rules to Kubernetes YAML."
      - id: d
        text: "`trivy version`"
        explanation: "It prints version information and scans nothing."
    correct_option: c
    explanation: "Each Trivy command reads a different input: image, folder or configuration."

  - id: ats035-040-01-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Make a scan command fail a pipeline step."
    source_readings:
      - sections/section-040/module-02/course-02-severity-filters-unfixed-findings-and-exit-codes.md
    prompt: "A pipeline step runs `trivy image --severity HIGH,CRITICAL IMAGE` and always succeeds, even when it prints HIGH findings. What is missing?"
    options:
      - id: a
        text: "`--exit-code 1`"
        explanation: "Correct. The default exit code is 0, so the step fails only when an exit code is set for findings."
      - id: b
        text: "`--format json`"
        explanation: "The format changes the output, not the exit code."
      - id: c
        text: "`--skip-db-update`"
        explanation: "This flag skips the database download and does not affect the exit code."
      - id: d
        text: "`--scanners secret`"
        explanation: "This selects the secret scanner and removes the vulnerability check."
    correct_option: a
    explanation: "Trivy returns exit code 0 by default. A gate needs --exit-code."

  - id: ats035-040-01-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Record a safe scan exception."
    source_readings:
      - sections/section-040/module-02/course-03-exceptions-database-freshness-and-what-a-finding-proves.md
    prompt: "A HIGH finding cannot be fixed this month. Which exception is the safest?"
    options:
      - id: a
        text: "Lower the severity threshold to CRITICAL for all images"
        explanation: "This hides every HIGH finding in every image."
      - id: b
        text: "Delete the finding from the stored report"
        explanation: "This destroys the evidence."
      - id: c
        text: "An ignore entry for that identifier with a reason, an owner and an end date"
        explanation: "Correct. The finding returns after the date and forces a new decision."
      - id: d
        text: "Stop scanning the image"
        explanation: "Without a scan, no finding is detected at all."
    correct_option: c
    explanation: "An exception is narrow, explained and time-limited."

  - id: ats035-040-01-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick Pod Security Admission behaviour."
    source_readings:
      - sections/section-040/module-01/course-04-a-release-decision-with-image-scans-and-pod-security-admission.md
    prompt: "A namespace has only the label `pod-security.kubernetes.io/warn: restricted`. A privileged pod is applied. What happens?"
    options:
      - id: a
        text: "The pod is rejected"
        explanation: "Only `enforce` rejects."
      - id: b
        text: "The pod is accepted and the client receives a warning"
        explanation: "Correct. `warn` does not block."
      - id: c
        text: "The pod runs without a warning"
        explanation: "`warn` sends a warning."
      - id: d
        text: "The namespace is deleted"
        explanation: "PSA never deletes namespaces."
    correct_option: b
    explanation: "Use `enforce` to reject."

  - id: ats035-040-01-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the Pod Security Standards."
    source_readings:
      - sections/section-040/module-03/course-01-the-pod-security-standards.md
    prompt: "Which list names the three Pod Security Standards from least to most strict?"
    options:
      - id: a
        text: "`open`, `closed`, `locked`"
        explanation: "These are not Pod Security Standard names."
      - id: b
        text: "`audit`, `warn`, `enforce`"
        explanation: "These are modes, not standards."
      - id: c
        text: "`restricted`, `baseline`, `privileged`"
        explanation: "This lists the standards from most to least strict."
      - id: d
        text: "`privileged`, `baseline`, `restricted`"
        explanation: "Correct. Each level contains the limits of the one before it."
    correct_option: d
    explanation: "privileged has no limits, baseline blocks known escalation paths, and restricted adds hardening requirements."

  - id: ats035-040-01-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Preview a Pod Security Admission label change."
    source_readings:
      - sections/section-040/module-03/course-02-namespace-labels-modes-and-versions.md
    prompt: "You want to know which running pods would violate `enforce=restricted` before you set the label. Which command is safe?"
    options:
      - id: a
        text: "`kubectl label --overwrite namespace NAME pod-security.kubernetes.io/enforce=restricted`"
        explanation: "This sets the label for real."
      - id: b
        text: "`kubectl delete pods --all -n NAME`"
        explanation: "This removes the pods."
      - id: c
        text: "`kubectl label --dry-run=server --overwrite namespace NAME pod-security.kubernetes.io/enforce=restricted`"
        explanation: "Correct. The server evaluates the change, prints warnings for violating pods and stores nothing."
      - id: d
        text: "`kubectl get namespace NAME`"
        explanation: "This shows the namespace and checks no pod."
    correct_option: c
    explanation: "A server-side dry run lists the pods that would violate the new level and changes nothing."

  - id: ats035-040-01-q19
    type: single_choice
    difficulty: advanced
    learning_objective: "Fix a pod that fails the restricted standard."
    source_readings:
      - sections/section-040/module-03/course-03-meeting-restricted-exemptions-and-limits.md
    prompt: "A pod sets only `runAsNonRoot: true` and `runAsUser: 1000`. It is rejected in a `restricted` namespace. Which set of changes fixes it?"
    options:
      - id: a
        text: "Add `privileged: false` and `readOnlyRootFilesystem: true`"
        explanation: "No standard requires a read-only file system, and the other required fields are still missing."
      - id: b
        text: "Add `allowPrivilegeEscalation: false`, drop all capabilities and set the `RuntimeDefault` seccomp profile"
        explanation: "Correct. These are the remaining requirements of the restricted standard."
      - id: c
        text: "Label the namespace with `warn` instead of `enforce`"
        explanation: "This lets the pod in but does not make it meet the standard."
      - id: d
        text: "Set `hostNetwork: true`"
        explanation: "Host networking is forbidden by baseline and restricted."
    correct_option: b
    explanation: "The error message lists every violated field, and the fix is to set each of them."

  - id: ats035-040-01-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Join evidence in a decision."
    source_readings:
      - sections/section-040/module-01/course-01-what-static-analysis-can-and-cannot-show.md
      - sections/section-040/module-01/course-04-a-release-decision-with-image-scans-and-pod-security-admission.md
    prompt: "Which release decision uses the evidence correctly?"
    options:
      - id: a
        text: "Pass when Kubesec scores above zero"
        explanation: "One input is not enough."
      - id: b
        text: "Pass when the namespace enforces `restricted`, ignoring image scans"
        explanation: "Enforcement does not show vulnerable packages."
      - id: c
        text: "Pass when the image has no vulnerabilities, ignoring the manifest"
        explanation: "The manifest can still be risky."
      - id: d
        text: "Pass when the digest scan, the manifest findings and the namespace enforcement all meet policy, with exceptions recorded"
        explanation: "Correct. Each tool answers a separate question."
    correct_option: d
    explanation: "Combine manifest, image and cluster evidence."
