apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-035-040-01-03
  labels:
    project: starfleet-035-040-01-03
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-035-040-01-03
  labels:
    project: outpost-035-040-01-03
---
apiVersion: v1
kind: Pod
metadata:
  name: scanner
  namespace: starfleet-035-040-01-03
  labels:
    app: scanner
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
  - name: kubesec
    image: docker.io/kubesec/kubesec:v2.15.0
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - while true; do sleep 3600; done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: score-probe
  namespace: starfleet-035-040-01-03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: score-probe
  template:
    metadata:
      labels:
        app: score-probe
    spec:
      containers:
      - name: app
        image: docker.io/library/busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - while true; do date > /tmp/last-run; sleep 30; done
        securityContext:
          privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost-035-040-01-03
  labels:
    app: drifter
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
