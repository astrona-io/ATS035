apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-040-01-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: analysis-findings
    description: analysis-findings records privileged true and the missing runAsNonRoot and allowPrivilegeEscalation
    type: file
    source: validation/validate-analysis-findings.sh
    points: 1
  - name: analyzed-reader
    description: Pod analyzed-reader runs with the hardened settings and is Ready
    type: file
    source: validation/validate-analyzed-reader.sh
    points: 2
