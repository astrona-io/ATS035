apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-040-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    # KubeLinter 0.8.3 on Alpine, the tool the task runs inside the cluster.
    # Index digest on 2026-11-22:
    # sha256:b8311611c27032d4922bc67719225e373e4a0ab0c767bbdcf5f20a9306b1a3bb
    preloadImages:
    - docker.io/stackrox/kube-linter:v0.8.3-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: lint-clean
    description: KubeLinter with the team configuration reports no findings for the live lint-probe Deployment, and only no-read-only-root-fs is excepted
    type: file
    source: validation/validate-lint-clean.sh
    points: 1
  - name: scoped-exception
    description: The lint-probe Deployment records the no-read-only-root-fs exception with a reason and an owner
    type: file
    source: validation/validate-scoped-exception.sh
    points: 1
  - name: hardened-rollout
    description: Every running lint-probe pod is from the current rollout, runs busybox 1.37.0 as user 10001 and has written its state file
    type: file
    source: validation/validate-hardened-rollout.sh
    points: 1
