apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-035-040-01-02
  labels:
    project: starfleet-035-040-01-02
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-035-040-01-02
  labels:
    project: outpost-035-040-01-02
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lint-policy
  namespace: starfleet-035-040-01-02
data:
  kube-linter.yaml: |
    checks:
      doNotAutoAddDefaults: true
      include:
        - privileged-container
        - privilege-escalation-container
        - run-as-non-root
        - no-read-only-root-fs
        - latest-tag
        - unset-cpu-requirements
        - unset-memory-requirements
---
apiVersion: v1
kind: Pod
metadata:
  name: linter
  namespace: starfleet-035-040-01-02
  labels:
    app: linter
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
  - name: kube-linter
    image: docker.io/stackrox/kube-linter:v0.8.3-alpine
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - while true; do sleep 3600; done
    volumeMounts:
    - name: policy
      mountPath: /policy
      readOnly: true
  volumes:
  - name: policy
    configMap:
      name: lint-policy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lint-probe
  namespace: starfleet-035-040-01-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lint-probe
  template:
    metadata:
      labels:
        app: lint-probe
    spec:
      containers:
      - name: app
        image: docker.io/library/busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - while true; do date > /tmp/last-run; sleep 30; done
        securityContext:
          privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost-035-040-01-02
  labels:
    app: drifter
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
