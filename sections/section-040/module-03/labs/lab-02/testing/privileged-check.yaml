apiVersion: v1
kind: Pod
metadata:
  name: privileged-check
  namespace: hangar-035-040-03-02
spec:
  restartPolicy: Never
  containers:
  - name: check
    image: docker.io/library/busybox:1.37.0
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "sleep 3600"]
    securityContext:
      privileged: true
