apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-040-03-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: mode-labels
    description: Namespace hangar-035-040-03-02 enforces baseline and warns and audits restricted, each pinned to v1.35
    type: file
    source: validation/validate-mode-labels.sh
    points: 1
  - name: baseline-enforced
    description: A privileged pod is rejected by baseline v1.35, and a plain pod is admitted with a restricted v1.35 warning
    type: file
    source: validation/validate-baseline-enforced.sh
    points: 1
  - name: cargo-loader-running
    description: The cargo-loader Deployment is rolled out in hangar-035-040-03-02 while legacy-scanner keeps running
    type: file
    source: validation/validate-cargo-loader-running.sh
    points: 1
