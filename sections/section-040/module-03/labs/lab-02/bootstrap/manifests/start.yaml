---
# A pod that does not meet baseline. It must keep running after enforce is set.
apiVersion: v1
kind: Pod
metadata:
  name: legacy-scanner
  namespace: hangar-035-040-03-02
  labels:
    app: legacy-scanner
spec:
  restartPolicy: Never
  containers:
  - name: scanner
    image: docker.io/library/busybox:1.37.0
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    securityContext:
      privileged: true
---
