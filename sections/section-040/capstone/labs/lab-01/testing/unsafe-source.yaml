{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "unsafe-source",
    "namespace": "bay"
  },
  "spec": {
    "containers": [
      {
        "command": [
          "sh",
          "-c",
          "sleep 3600"
        ],
        "image": "docker.io/library/busybox:latest",
        "name": "reader",
        "securityContext": {
          "privileged": true
        }
      }
    ],
    "restartPolicy": "Never"
  }
}
