apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-035-020-03-02
  labels:
    project: starfleet-035-020-03-02
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-035-020-03-02
  labels:
    project: outpost-035-020-03-02
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet-035-020-03-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
      - name: client
        image: docker.io/library/busybox:1.37.0-scout
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - sleep 3600
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost-035-020-03-02
  labels:
    app: drifter
spec:
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
  restartPolicy: Never
