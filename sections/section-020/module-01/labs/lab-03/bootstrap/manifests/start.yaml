apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-035-020-01-03
  labels:
    project: starfleet-035-020-01-03
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-035-020-01-03
  labels:
    project: outpost-035-020-01-03
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-035-020-01-03
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/python:3.13-alpine
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -c
        - import time; time.sleep(10**9)
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost-035-020-01-03
  labels:
    app: drifter
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
