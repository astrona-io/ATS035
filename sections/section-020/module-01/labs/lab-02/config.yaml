apiVersion: astrona.io/v1
metadata:
  name: ats-035-lab-020-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: inventory-containers
    description: image-inventory has a line for every running app container with its pod, name and image
    type: file
    source: validation/validate-inventory-containers.sh
    points: 1
  - name: inventory-init-containers
    description: image-inventory has a line for every init container with its pod, name and image
    type: file
    source: validation/validate-inventory-init-containers.sh
    points: 1
  - name: inventory-image-ids
    description: Every image-inventory line carries the live imageID, with no missing, extra or repeated lines
    type: file
    source: validation/validate-inventory-image-ids.sh
    points: 1
